<!-- @dsCard group="Colors" viewport="700x180" name="Core Five" subtitle="Forest is ink, Sand is canvas, Fairway secondary, Bunker detail, Flag accent" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:180px;box-sizing:border-box}.grid{display:flex;gap:14px}.sw{flex:1}.chip{height:70px;border:1px solid rgba(20,40,34,.12)}.meta{display:flex;flex-direction:column;gap:1px;margin-top:8px}.meta b{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.meta span{font-size:11px;color:var(--fairway);font-variant-numeric:tabular-nums}.meta em{font-size:10.5px;font-style:normal;color:var(--bunker);letter-spacing:.04em;text-transform:uppercase;line-height:1.3}</style></head><body><div class="f"><div class="grid">
<div class="sw"><div class="chip" style="background:#1E3A32"></div><div class="meta"><b>Forest</b><span>#1E3A32</span><em>Primary ink</em></div></div>
<div class="sw"><div class="chip" style="background:#F5F0E8"></div><div class="meta"><b>Sand</b><span>#F5F0E8</span><em>Canvas</em></div></div>
<div class="sw"><div class="chip" style="background:#718D58"></div><div class="meta"><b>Fairway</b><span>#718D58</span><em>Secondary</em></div></div>
<div class="sw"><div class="chip" style="background:#ADA366"></div><div class="meta"><b>Bunker</b><span>#ADA366</span><em>Gold detail</em></div></div>
<div class="sw"><div class="chip" style="background:#FC5656"></div><div class="meta"><b>Flag</b><span>#FC5656</span><em>One accent moment</em></div></div>
</div></div></body></html>
