<!-- @dsCard group="Brand" viewport="700x180" name="Motion" subtitle="Short, linear-ish, no bounce except the flag plant" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:180px;box-sizing:border-box}.f{display:flex;flex-direction:column;gap:9px;justify-content:center}.tok{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:12.5px}.tok b{font-weight:700;letter-spacing:.05em}.tok span{color:var(--fairway)}</style></head><body>
<div class="f">
<div class="tok"><b>Reveal on scroll</b><span>opacity + 20px rise, .55s ease, .1s stagger</span></div>
<div class="tok"><b>Hover, buttons</b><span>colour swap + translateY(-1px), .2s</span></div>
<div class="tok"><b>Hover, course rows</b><span>translateX up to 80px, .42s cubic-bezier(.3,.7,.2,1)</span></div>
<div class="tok"><b>Hover, photos</b><span>scale(1.04), .4s ease</span></div>
<div class="tok" style="border-bottom:none"><b>Flag plant</b><span>cubic-bezier(.34,1.7,.5,1) &middot; the only overshoot</span></div>
</div></body></html>
