<!-- @dsCard group="Spacing" viewport="700x200" name="Section Rhythm" subtitle="Fluid vertical padding, fixed container widths" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:200px;box-sizing:border-box}.f{display:flex;flex-direction:column;gap:10px;justify-content:center}.tok{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:13px}.tok b{font-weight:700;letter-spacing:.06em}.tok span{color:var(--fairway);font-variant-numeric:tabular-nums}</style></head><body>
<div class="f">
<div class="tok"><b>--section-y</b><span>clamp(72px, 12vh, 140px)</span></div>
<div class="tok"><b>--section-x</b><span>clamp(20px, 4vw, 48px)</span></div>
<div class="tok"><b>--band-pad</b><span>clamp(36px, 5vw, 76px)</span></div>
<div class="tok"><b>--w-prose / --w-content / --w-wide</b><span>820px / 1100px / 1360px</span></div>
<div class="tok" style="border-bottom:none"><b>Photo gutters</b><span>3px, always</span></div>
</div></body></html>
