<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="Zero everywhere except buttons, badges and dots" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:150px;box-sizing:border-box}.f{display:flex;align-items:center;gap:18px}.b{background:var(--sand-deep);border:1.5px solid var(--forest);width:110px;height:66px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--forest);text-align:center;padding:6px}.note{font-size:12.5px;color:var(--fairway);line-height:1.5;max-width:34ch}</style></head><body>
<div class="f">
<div class="b">0 &middot; cards, bands, tables, images, stamps</div>
<div class="b" style="border-radius:999px">999px &middot; buttons, badges, dots</div>
<p class="note">There is no middle radius. If it is not a control, it has square corners.</p>
</div></body></html>
