<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:180px;box-sizing:border-box}.grid{display:flex;gap:14px}.sw{flex:1}.chip{height:70px;border:1px solid rgba(20,40,34,.12)}.meta{display:flex;flex-direction:column;gap:1px;margin-top:8px}.meta b{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.meta span{font-size:11px;color:var(--fairway);font-variant-numeric:tabular-nums}.meta em{font-size:10.5px;font-style:normal;color:var(--bunker);letter-spacing:.04em;text-transform:uppercase;line-height:1.3}</style></head><body><div class="f"><div class="grid">
<div class="sw"><div class="chip" style="background:#142822"></div><div class="meta"><b>Shadow Ink</b><span>#142822</span><em>Deepest surface</em></div></div>
<div class="sw"><div class="chip" style="background:#EDE6D8"></div><div class="meta"><b>Sand Deep</b><span>#EDE6D8</span><em>Second canvas</em></div></div>
<div class="sw"><div class="chip" style="background:#FFFCF5"></div><div class="meta"><b>Cream</b><span>#FFFCF5</span><em>Card fill, text on dark</em></div></div>
<div class="sw"><div class="chip" style="background:#E04444"></div><div class="meta"><b>Flag Deep</b><span>#E04444</span><em>Hover only</em></div></div>
<div class="sw"><div class="chip" style="background:#D8CFBC"></div><div class="meta"><b>Line</b><span>#D8CFBC</span><em>Hairline on sand</em></div></div>
</div></div></body></html>
