<!-- @dsCard group="Colors" viewport="700x210" name="Spending Flag Red" subtitle="One accent moment per viewport. Never a general-purpose accent." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:210px;box-sizing:border-box}.f{display:grid;grid-template-columns:1fr 1fr;gap:14px}.demo{border:1.5px solid var(--line);background:var(--cream);padding:14px;display:flex;flex-direction:column;gap:9px}.demo h4{margin:0;font-family:var(--font-impact);font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}.ok h4{color:var(--fairway)}.no h4{color:var(--flag)}.line{height:9px;background:rgba(20,40,34,.1)}.line.short{width:58%}.cta{align-self:flex-start;background:var(--flag);color:var(--cream);border-radius:999px;padding:8px 16px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.cta.ghost{background:transparent;color:var(--forest);border:2px solid var(--forest)}.rule{height:2px;background:var(--forest)}.rule.red{background:var(--flag)}</style></head><body>
<div class="f">
<div class="demo ok"><h4>Yes &middot; spent once</h4><div class="rule"></div><div class="line"></div><div class="line short"></div><div style="display:flex;gap:8px"><span class="cta">Get Tickets</span><span class="cta ghost">Charities</span></div></div>
<div class="demo no"><h4>No &middot; spent everywhere</h4><div class="rule red"></div><div class="line" style="background:rgba(252,86,86,.28)"></div><div class="line short" style="background:rgba(252,86,86,.28)"></div><div style="display:flex;gap:8px"><span class="cta">Get Tickets</span><span class="cta">Charities</span></div></div>
</div></body></html>
