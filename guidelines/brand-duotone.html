<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:200px;box-sizing:border-box}.f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding:0;height:200px;background:var(--shadow-ink)}.f>div{position:relative;overflow:hidden}.f img{width:100%;height:100%;object-fit:cover;display:block}.cap{position:absolute;left:0;right:0;bottom:0;background:rgba(20,40,34,.8);color:var(--bunker);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 8px}</style></head><body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0"><defs><filter id="tgg-duotone" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="table" tableValues="0.118 0.961"/><feFuncG type="table" tableValues="0.227 0.941"/><feFuncB type="table" tableValues="0.196 0.910"/></feComponentTransfer></filter></defs></svg>
<div class="f">
<div><img src="../assets/images/photos/strip1.webp" alt="Untreated original"><span class="cap">Original</span></div>
<div><img src="../assets/images/photos/strip1.webp" alt="Duotone treated" style="filter:url(#tgg-duotone)"><span class="cap">Duotone</span></div>
<div><img src="../assets/images/photos/hero.webp" alt="Duotone behind type" style="filter:url(#tgg-duotone);opacity:.55"><span class="cap">Duotone at 55% behind type</span></div>
</div></body></html>
