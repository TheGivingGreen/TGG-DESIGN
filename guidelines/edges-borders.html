<!-- @dsCard group="Spacing" viewport="700x180" name="Rules and Borders" subtitle="Square corners. Hard rules instead of shadows." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:180px;box-sizing:border-box}.f{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.d{background:var(--cream);padding:12px;display:flex;flex-direction:column;justify-content:space-between}.n{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bunker)}.v{font-size:11.5px;color:var(--fairway);margin-top:auto}</style></head><body>
<div class="f">
<div class="d" style="border:1px solid var(--line)"><span class="n">Hairline</span><span class="v">1px Line &middot; table rows</span></div>
<div class="d" style="border:1.5px solid var(--line)"><span class="n">Card</span><span class="v">1.5px Line &middot; default card</span></div>
<div class="d" style="border:2px solid var(--forest)"><span class="n">Strong</span><span class="v">2px Forest &middot; featured, scorecard</span></div>
<div class="d" style="border:2px solid var(--forest);border-left-width:0;border-right-width:0"><span class="n">Section Rule</span><span class="v">2px Forest &middot; stacks, FAQ</span></div>
</div></body></html>
