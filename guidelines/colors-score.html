<!-- @dsCard group="Colors" viewport="700x150" name="Score Semantics" subtitle="Fairway takes strokes off, Flag marks the best move, Bunker adds strokes" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:150px;box-sizing:border-box}.f{display:flex;align-items:center;gap:0;flex-direction:column;justify-content:center;padding:0 20px}.r{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:520px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}.r:last-child{border-bottom:none}.n{font-family:var(--font-impact);font-size:24px;line-height:1}</style></head><body>
<div class="f">
<div class="r"><span>Skip a bar entirely</span><span class="n" style="color:var(--bunker)">+2</span></div>
<div class="r"><span>Order any drink</span><span class="n" style="color:var(--fairway)">&minus;1</span></div>
<div class="r"><span>Order the hole's official sponsored drink</span><span class="n" style="color:var(--flag)">&minus;2</span></div>
</div></body></html>
