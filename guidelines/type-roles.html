<!-- @dsCard group="Type" viewport="700x200" name="Three Fixed Roles" subtitle="Anton impact, Playfair ceremonial, DM Sans everything else" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{background:var(--sand);background-image:none;font-family:var(--font-body);color:var(--forest)}.f{padding:18px 20px;height:200px;box-sizing:border-box}.f{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.r{border:1.5px solid var(--line);background:var(--cream);padding:14px;display:flex;flex-direction:column;gap:8px}.n{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bunker)}.job{font-size:11.5px;color:var(--fairway);line-height:1.45;margin-top:auto}</style></head><body>
<div class="f">
<div class="r"><span class="n">Anton</span><span style="font-family:var(--font-impact);font-size:30px;line-height:.92;text-transform:uppercase">Fore Good</span><span class="job">Impact headlines. All caps, always. Never body, never buttons.</span></div>
<div class="r"><span class="n">Playfair Display 600</span><span style="font-family:var(--font-ceremonial);font-style:italic;font-weight:600;font-size:24px">Fore Good.</span><span class="job">Ceremonial taglines and the wordmark. One line at a time.</span></div>
<div class="r"><span class="n">DM Sans</span><span style="font-size:22px;font-weight:500">Fore Good</span><span class="job">All body copy, all UI, every label and button.</span></div>
</div></body></html>
