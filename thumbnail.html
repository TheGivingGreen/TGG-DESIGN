<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0;background:var(--forest)}
.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 232px}
.main{background:var(--forest);display:flex;align-items:center;justify-content:center;padding:0 40px}
.main img{width:520px;height:auto}
.strip{display:grid;grid-template-rows:repeat(3,1fr)}
</style></head>
<body><div class="tile">
<div class="main"><img src="assets/images/logos/logo-heart-flag-cream.svg" alt="The Giving Green"></div>
<div class="strip">
<div style="background:#F5F0E8"></div>
<div style="background:#ADA366"></div>
<div style="background:#FC5656"></div>
</div>
</div></body></html>
